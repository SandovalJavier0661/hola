<!DOCTYPE html>
<html>
    <head>
        <title>Club Cinépolis - Iniciar Sesión</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
                background-color: #f0f4f8;
            }

            header {
                background-color: #0b2545;
                padding: 25px;
                text-align: center;
                color: white;
            }

            header h1 {
                margin: 0;
                font-size: 36px;
            }

            header h2 {
                margin: 8px 0 0 0;
                font-size: 16px;
                font-weight: normal;
                color: #e0e0e0;
            }

            nav {
                background-color: #134074;
                padding: 12px;
                text-align: center;
            }

            nav a {
                color: white;
                text-decoration: none;
                padding: 8px 18px;
                display: inline-block;
                font-size: 15px;
            }

            .tarjeta-login {
                width: 380px;
                margin: 40px auto;
                background: white;
                padding: 25px;
                border-radius: 6px;
                box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            }

            .tarjeta-login h2 {
                color: #0b2545;
                text-align: center;
                margin-top: 0;
                font-size: 24px;
            }

            .tarjeta-login label {
                display: block;
                margin-top: 15px;
                font-weight: bold;
                color: #134074;
            }

            .tarjeta-login input {
                width: 100%;
                padding: 8px;
                margin-top: 5px;
            }

            .btn-ingresar {
                background-color: #0b2545;
                color: white;
                border: none;
                padding: 10px;
                width: 100%;
                margin-top: 20px;
                font-size: 16px;
                cursor: pointer;
            }

            .texto-registro {
                text-align: center;
                margin-top: 20px;
                font-size: 14px;
            }

            .texto-registro a {
                color: #134074;
                font-weight: bold;
            }

            footer {
                background-color: #0b2545;
                padding: 15px;
                text-align: center;
                color: white;
                margin-top: 50px;
            }

            footer p {
                margin: 4px 0;
            }
        </style>
    </head>
    <body>

        <header>
            <h1>Cinépolis</h1>
            <h2>La Capital del Cine</h2>
        </header>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="#">Próximos Estrenos</a>
            <a href="login.html">Club Cinépolis</a>
        </nav>

        <div class="tarjeta-login">
            <h2>Acceso a Club Cinépolis</h2>

            <form action="index.html" method="GET">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="btn-ingresar">Iniciar Sesión</button>
            </form>

            <div class="texto-registro">
                <p>¿Aún no tienes tarjeta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>

        <footer>
            <p>López Martínez Genesis</p>
            <p>24308051280586</p>
            <p>5ºI</p>
        </footer>

    </body>
</html>
