        <style>

            }

            header {

            }

            .pelicula h3 {

                height: 40px;
                margin: 10px 0;
                color: #134074;
            }

            .pelicula a {
                display: inline-block;
                background-color: #0b2545;
                color: white;
                padding: 8px 14px;
                text-decoration: none;
                font-size: 14px;
            }

            footer {
                background-color: #0b2545;
                padding: 15px;
                text-align: center;
                color: white;
                margin-top: 40px;
            }

            footer p {
